<!DOCTYPE html>
<html>

<head>
    <title>Meal Planner</title>
</head>
 
<body>

<h2>Isabella Mills meal planner</h2>

<form>
    <input type="checkbox" id="breakfast" name="meal" value="True">
    <label for="breakfast">Breakfast</label> <br>
    
    <input type="checkbox" id="lunch" name="meal" value="False">
    <label for="lunch">Lunch</label> <br>

    <input type="checkbox" id="dinner" name="meal" value="True">
    <label for="dinner">Dinner</label> <br>

    <input type="button" value="Meal Plan Choices" onclick="choices()">
</form>

<p id="result">This text will be replaced </p>

<form>
    <label for="cuisine">Enter cuisine type </label>
    <input type="text" id="cuisine" name="order" value="Italian"> <br>

    <label for="beverage">Enter beverage choice </label>
    <input type="text" id="beverage" name="order" value="Water"> <br>

    <input type="button" value="Update the meal plan" onclick="updateMeal()">
</form>

<script> 

var my_meal_plan = {}

function choices (){
    console.log("Getting form values");
    my_meal_plan = {};

    my_meal_plan.breakfast = document.getElementById("breakfast").checked;
    my_meal_plan.lunch = document.getElementById("lunch").checked;
    my_meal_plan.dinner = document.getElementById("dinner").checked;

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan);
}

function updateMeal() {
    console.log("Getting form values");
    my_meal_plan = {};
    
    cuisine = document.getElementById("cuisine").value;
    beverage = document.getElementById("beverage").value;

    my_meal_plan["cuisine"] = cuisine;
    my_meal_plan["beverage"] = beverage;

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan);
}
</script>

</body>
</html>
