<!DOCTYPE html>
<html>

<head>
    <title>Sales Computation</title>
</head>
 
<body>

<h2>Isabella Mills sales computation</h2>

<form>
    <label for="numberItems">Enter number items </label>
    <input type ="number" id="numberItems" name="numberItems" value=1> <br>

    <label for="itemCost">Enter the cost of one item </label>
    <input type ="number" id="itemCost" name="itemCost" value=20.0> <br>

    <label for="numberForDiscount">Enter number to get discount </label>
    <input type="number" id="numberForDiscount" name="numberForDiscount" value=10> <br>

    <label for="discountRate">Enter the discount rate </label>
    <input type="number" id="discountRate" name="discountRate" value=0.15> <br>

    <input type="button" onclick="doDiscount()" value="Show costs">
</form>

<p id="costResult">This text will be replaced </p>

<form>
    <input type="radio" id="product" name="op" value="mul" onclick="chooseOp()">
    <label for="product">Product </label> <br>

    <input type="radio" id="sum" name="op" value="add" onclick="chooseOp()">
    <label for="sum">Sum </label> <br>

    <input type="radio" id="divide" name="op" value="div" onclick="chooseOp()">
    <label for="divide">Divide </label> <br>
</form>

<p id="opResult">This text will be replaced </p>

<script> 
    function doDiscount (){
        console.log("Getting form values");
        numberItems = parseFloat(document.getElementById("numberItems").value);
        itemCost = parseFloat(document.getElementById("itemCost").value);
        discountRate = parseFloat(document.getElementById("discountRate").value);
        discountAt = parseFloat(document.getElementById("numberForDiscount").value);
        costs = "";
        
        for(var i = 1; i <= 5; i++){
            var checkCount = i * numberItems;
            var totalCost;

            if (checkCount <= discountAt){
                totalCost = checkCount * itemCost;
            }
            else {
                totalCost = (discountAt * itemCost) + ((checkCount - discountAt) * itemCost * (1 - discountRate));
            }

            costs += checkCount + " is " + totalCost + "; "
        }
        document.getElementById("costResult").innerHTML = "Costs are: " + costs;
    }

    function chooseOp() {
        numberItems = parseFloat(document.getElementById("numberItems").value);
        discountAt = parseFloat(document.getElementById("numberForDiscount").value);
        text = ""

        if (document.getElementById("product").checked) {
            text = numberItems + " times " + discountAt + " is " + (numberItems * discountAt)
        }
        else if (document.getElementById("sum").checked) {
            text = numberItems + " plus " + discountAt + " is " + (numberItems + discountAt)
        }
        else if (document.getElementById("divide").checked) {
            text = numberItems + " divided by " + discountAt + " is " + (numberItems / discountAt)
        }
        
        document.getElementById("opResult").innerHTML = text;
    }
</script>

</body>
</html>
